name: Verify database and authentication
on:
  pull_request:
    paths:
      - 'src/lib/**'
      - 'src/app/login/**'
      - 'src/app/admin/**'
      - 'src/app/staff/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/database-ci.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: royal_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d royal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/royal_test
      DATABASE_URL_UNPOOLED: postgresql://postgres@127.0.0.1:5432/royal_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run db:migrate && npm run db:migrate
      - run: npm run build
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test isolated staff authentication
        run: |
          export BOOTSTRAP_OWNER_EMAIL="owner@example.invalid"
          export BOOTSTRAP_OWNER_PASSWORD="$(node -e "console.log(require('crypto').randomBytes(24).toString('hex'))")"
          echo "::add-mask::$BOOTSTRAP_OWNER_PASSWORD"
          npm run db:seed
          npm run start -- --port 3000 >/tmp/royal-db-test.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          node --experimental-strip-types tests/database-browser.mjs
