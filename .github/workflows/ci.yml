name: Verify application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Smoke test
        run: |
          npm run start -- --port 3000 > /tmp/royal-table.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          node -e "const a=require('/tmp/health.json'); if(a.status!=='ok'||a.database!=='not_configured')process.exit(1)"
          curl -fsS http://localhost:3000/ | grep -q 'The Royal Table'
      - uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
