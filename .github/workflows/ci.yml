name: Verify application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Smoke test
        run: |
          npm run start -- --port 3000 > /tmp/royal-table.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          node -e "const a=require('/tmp/health.json'); if(a.status!=='ok'||a.database!=='not_configured')process.exit(1)"
          curl -fsS http://127.0.0.1:3000/ | grep -q 'The Royal Table'
      - uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
      - name: Install browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser verification
        run: |
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null || (npm run start -- --port 3000 >/tmp/royal-table.log 2>&1 & sleep 5)
          node tests/browser.mjs
  lockfile:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: npm-lockfile
          path: .
      - name: Commit verified dependency lockfile
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then echo "Branch advanced; not changing it"; exit 0; fi
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record CI-verified dependency lockfile [skip ci]"
          git push origin HEAD:main
